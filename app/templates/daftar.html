<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2f9" />
    <title>Daftar · Sakit-Learn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/masuk.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/efek.css') }}" rel="stylesheet" />
  </head>

  <body data-page="daftar">
    <a class="visually-hidden-focusable skip-link" href="#main">Lewati ke konten</a>

    <div id="site-navbar">
      {% include 'components/navbar.html' %}
    </div>

    <main class="container pb-5" id="main">
      <div class="auth-wrap">
        <div class="auth-card glass">
          <div class="auth-header">
            <span class="auth-logo"><i class="bi bi-person-plus-fill" aria-hidden="true"></i></span>
            <h1>Pendaftaran</h1>
            <p>Belum tersedia</p>
          </div>

          <div class="auth-body text-center py-3">
            <p class="text-muted mb-3">
              Pendaftaran akun baru akan dibuka pada rilis berikutnya. Untuk sementara, silakan gunakan akun
              yang sudah terdaftar.
            </p>
            <a href="{{ url_for('main.masuk') }}" class="btn btn-sl">
              <i class="bi bi-box-arrow-in-right me-1"></i> Ke Halaman Masuk
            </a>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer">
      {% include 'components/footer.html' %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/efek.js') }}"></script>
  </body>
</html>
