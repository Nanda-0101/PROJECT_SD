<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef2f9">
  <title>Login · Sakit-Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/masuk.css') }}" rel="stylesheet">
</head>
<body data-page="login">
  <a class="visually-hidden-focusable skip-link" href="#main">Lewati ke konten</a>
  <div id="site-navbar"></div>

  <main class="container pb-5" id="main">
    <div class="auth-wrap">
      <div class="auth-card glass">
        <div class="auth-header">
          <span class="auth-logo"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></span>
          <h1>Sakit-Learn</h1>
          <p>Login untuk melanjutkan</p>
        </div>
        <div class="auth-body">
          <div id="formAlert" aria-live="polite"></div>
          <form id="loginForm" novalidate>
            <div class="mb-3 field">
              <label class="form-label" for="username">Username</label>
              <div class="input-group has-validation">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" autocomplete="username" autocapitalize="none" required>
                <div class="invalid-feedback">Isi username Anda.</div>
              </div>
            </div>
            <div class="mb-4 field">
              <label class="form-label" for="password">Password</label>
              <div class="input-group has-validation">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary pw-toggle" type="button" id="togglePw" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
                <div class="invalid-feedback">Isi password Anda.</div>
              </div>
            </div>
            <button type="submit" class="btn btn-sl btn-lg w-100" id="btnSubmit"><i class="bi bi-box-arrow-in-right me-1"></i> Login</button>
          </form>
          <div class="demo-box mt-4">
            <span><i class="bi bi-stars text-primary"></i> Akun demo: <b>demo</b> / <b>demo123</b></span>
            <button type="button" class="btn btn-glass btn-sm" id="fillDemo">Isi otomatis</button>
          </div>
          <p class="auth-switch">Belum punya akun? <a href="{{ url_for('daftar') }}">Daftar sekarang</a></p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mock-api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/masuk.js') }}"></script>
</body>
</html>
