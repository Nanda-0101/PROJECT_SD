<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2f9" />
    <title>Masuk · Sakit-Learn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/masuk.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/efek.css') }}" rel="stylesheet" />
  </head>

  <body data-page="masuk">
    <a class="visually-hidden-focusable skip-link" href="#main">Lewati ke konten</a>

    <div id="site-navbar">
      {% include 'components/navbar.html' %}
    </div>

    <main class="container pb-5" id="main">
      <div class="auth-wrap">
        <div class="auth-card glass">
          <div class="auth-header">
            <span class="auth-logo"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></span>
            <h1>Sakit-Learn</h1>
            <p>Masuk ke akun Anda</p>
          </div>

          <div class="auth-body">
            <div id="formAlert" aria-live="polite">
              {% if error %}
              <div class="alert alert-danger py-2 mb-3" role="alert">{{ error }}</div>
              {% endif %}
            </div>

            <form id="loginForm" method="POST" action="{{ url_for('main.masuk') }}" novalidate>
              <div class="mb-3 field">
                <label class="form-label" for="username">Username</label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    minlength="3"
                    required
                    value="{{ username or '' }}"
                  />
                  <div class="invalid-feedback">Masukkan username Anda (min. 3 karakter).</div>
                </div>
              </div>

              <div class="mb-3 field">
                <label class="form-label" for="password">Password</label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                  />
                  <button class="btn btn-outline-secondary pw-toggle" type="button" id="togglePw" aria-label="Tampilkan password">
                    <i class="bi bi-eye" aria-hidden="true"></i>
                  </button>
                  <div class="invalid-feedback">Masukkan password Anda.</div>
                </div>
              </div>

              <button type="submit" class="btn btn-sl btn-lg w-100" id="btnSubmit">
                <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i> Masuk
              </button>
            </form>

            <p class="auth-switch">Belum punya akun? <a href="{{ url_for('main.daftar') }}">Daftar</a></p>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer">
      {% include 'components/footer.html' %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/efek.js') }}"></script>

    <script>
      // Toggle password — murni UI, tanpa backend
      document.getElementById("togglePw")?.addEventListener("click", (e) => {
        const input = document.getElementById("password");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        e.currentTarget.innerHTML = `<i class="bi bi-eye${show ? "-slash" : ""}"></i>`;
        e.currentTarget.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
      });
    </script>
  </body>
</html>
