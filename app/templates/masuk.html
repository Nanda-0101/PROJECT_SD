<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sakit-Learn: klasifikasi status berat badan dengan ensemble LightGBM dan MLP.">
  <title>Masuk · Sakit-Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/common.css" rel="stylesheet">
  <link href="css/masuk.css" rel="stylesheet">
</head>
<body data-page="login">
  <a class="visually-hidden-focusable skip-link" href="#main">Lewati ke konten</a>

  <div id="site-navbar"></div>

  <main id="main">
<div class="auth-wrap">
  <div class="card-sl auth-card p-4 p-md-5">
    <div class="text-center mb-4">
      <span class="brand-mark mx-auto mb-3"><i class="bi bi-heart-pulse-fill"></i></span>
      <h1 class="h3 mb-1">Masuk ke Sakit-Learn</h1>
      <p class="text-body-secondary mb-0">Masuk untuk memakai Klasifikasi dan melihat Riwayat Anda.</p>
    </div>

    <div id="formAlert" aria-live="polite"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3 field">
        <label class="form-label" for="username">Username</label>
        <div class="input-group has-validation">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username" autocomplete="username" autocapitalize="none" required>
          <div class="invalid-feedback">Isi username Anda.</div>
        </div>
      </div>
      <div class="mb-4 field">
        <label class="form-label" for="password">Password</label>
        <div class="input-group has-validation">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePw" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
          <div class="invalid-feedback">Isi password Anda.</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSubmit">Masuk</button>
    </form>

    
    <div class="demo-box mt-4">
      <div><strong>Akun demo</strong><br><span class="small text-body-secondary">demo / demo123</span></div>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="fillDemo">Isi otomatis</button>
    </div>
    

    <p class="text-center mt-4 mb-0 small">Belum punya akun? <a href="daftar.html" class="fw-semibold">Daftar</a></p>
  </div>
</div>
</main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/common.js"></script>
  <script src="js/masuk.js"></script>
</body>
</html>
